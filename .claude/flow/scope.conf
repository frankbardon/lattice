# .claude/flow/scope.conf — how flow narrows the pre-push gate at test-group
# checkpoints (FLOW_GATE_SCOPE=changed). Read by flow-shared's go-affected-pkgs.sh.
#
#   ignore <ERE>          changed paths matching never affect Go tests
#   map <ERE> <pkg-dir>   changed paths matching select that package's tests
#   always <pkg-dir>      always test this package in scoped runs
#
# Automatic (no entry needed): a file's own package + importers; tests that read
# it via a "../" path literal; tests that walk the repo tree. Anything else that
# changes outside a Go package makes the run fall back to ./... .
# Before adding `ignore`, check no test reads that path. The full suite still
# runs once per effort before the PR goes ready.

# Not read by any test (checked 2026-09-30). schemas/ and examples/ ARE read by
# tests via "../schemas", "../../examples" literals — detected automatically.
ignore ^\.claude/
ignore ^\.github/
ignore ^docs/
ignore ^[^/]+\.md$
